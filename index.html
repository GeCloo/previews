<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Site previews</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--text:#14181f;--muted:#5b6472;--line:#e4e4de;--accent:#0e7490}
@media (prefers-color-scheme: dark){:root{--bg:#0e1218;--card:#161c25;--text:#eef0f3;--muted:#9aa4b2;--line:#252d39;--accent:#22d3ee}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 16px}
h1{margin:0 0 4px;font-size:1.8rem}
p{margin:0 0 24px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a{display:block;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none}
a:hover,a:focus-visible{border-color:var(--accent);outline:none}
b{display:block;font-size:1.1rem}
span{color:var(--muted);font-size:.95rem}
small{display:block;margin-top:2px;color:var(--accent);font-size:.85rem}
</style>
</head>
<body>
<main>
<h1>Site previews</h1>
<p>2 sites · each opens in its own page.</p>
<ul>
<li><a href="av-autocentre/"><b>AV Autocentre</b><span>MOT &amp; Car Servicing in Slough</span><small>/av-autocentre/</small></a></li>
<li><a href="demo/"><b>Demo site</b><small>/demo/</small></a></li>
</ul>
</main>
</body>
</html>
